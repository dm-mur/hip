[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hip-data-platform"
version = "0.1.0"
description = "HIP - reusable data engineering platform for DHIS2 and other data sources"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.2,<3.0",
    "requests>=2.31,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require external services such as PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py311"

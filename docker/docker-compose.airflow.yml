x-airflow-common:
  &airflow-common
  image: hip-airflow:dev

  env_file:
    - .env

  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"

    DBT_LOG_PATH: /opt/airflow/logs/dbt
    DBT_TARGET_PATH: /opt/airflow/logs/dbt/target

  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/logs:/opt/airflow/logs
    - ../airflow/plugins:/opt/airflow/plugins
    - ../airflow/config:/opt/airflow/config
    - ../dbt:/opt/hip/dbt
    - ./airflow/dbt/profiles.yml:/home/airflow/.dbt/profiles.yml:ro

  networks:
    - hip-network

services:
  airflow-init:
    <<: *airflow-common
    container_name: hip-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate

  airflow-api-server:
    <<: *airflow-common
    container_name: hip-airflow-api-server
    restart: unless-stopped
    command: api-server

    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    container_name: hip-airflow-scheduler
    restart: unless-stopped
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    container_name: hip-airflow-dag-processor
    restart: unless-stopped
    command: dag-processor

networks:
  hip-network:
    external: true
    name: docker_hip-network

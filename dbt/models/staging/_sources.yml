version: 2

sources:
  - name: silver
    description: "HIP curated Silver-layer data managed by the Python/Flyway pipeline."
    schema: silver

    tables:
      - name: dhis2_observation
        description: "Curated DHIS2 observations processed from the Bronze layer."

      - name: dhis2_dataset
        description: "Authoritative DHIS2 dataset metadata."

  - name: gold
    description: "HIP Gold-layer views managed by Flyway and exposed to analytics consumers."
    schema: gold

    tables:
      - name: pipeline_health
        description: "Operational execution history for HIP ETL batches."
